name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: postgres://postgres:postgres@localhost:5432/threadline_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make tools
      - run: goose -dir sql/schema postgres "$TEST_DB_URL" up
      - run: make check
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: python scripts/generate_openapi.py && git diff --exit-code -- docs/openapi.json
      - run: make build
      - run: sqlc generate && git diff --exit-code -- internal/database
      - run: goose -dir sql/schema postgres "$TEST_DB_URL" down && goose -dir sql/schema postgres "$TEST_DB_URL" up
      - run: docker build -t threadline:ci .
      - run: bash -n scripts/threadline && ./scripts/threadline help
      - name: Verify one-command startup
        run: |
          ./scripts/threadline start
          curl --fail http://localhost:8080/api/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/app/.env)" = 404
          ./scripts/threadline status
      - name: Stop launcher services
        if: always()
        run: |
          if [ -f .threadline.env ]; then ./scripts/threadline stop; fi
