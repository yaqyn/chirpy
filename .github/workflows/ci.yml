name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threadline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: postgres://postgres:postgres@localhost:5432/threadline_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make tools
      - run: goose -dir sql/schema postgres "$TEST_DB_URL" up
      - run: make check
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: python scripts/generate_openapi.py && git diff --exit-code -- docs/openapi.json
      - run: make build
      - run: sqlc generate && git diff --exit-code -- internal/database
      - run: goose -dir sql/schema postgres "$TEST_DB_URL" down && goose -dir sql/schema postgres "$TEST_DB_URL" up
      - run: docker build -t threadline:ci .
